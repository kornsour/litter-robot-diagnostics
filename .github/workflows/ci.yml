name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel an in-progress run when a newer commit is pushed to the same ref, so we
# never burn minutes finishing a run that's already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Centralized, standardized CI shared across the Python template-derived
    # repos. See github.com/lurking-walrus/gh-automation.
    uses: lurking-walrus/gh-automation/.github/workflows/python-ci.yml@9755c5a968c76d19c7f54017d4bcd1b314810426 # main 2026-11-26
    with:
      python-version: "3.14"
      validate-opentofu: true
